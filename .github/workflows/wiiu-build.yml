name: Wii U build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the experimental Wii U builds (optional)
        type: string

permissions:
  contents: read

concurrency:
  group: wiiu-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source and FFL
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Make room for the cross-compiler
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$RUNNER_TEMP"

      - name: Generate Wii U build inputs
        run: python3 tools/prepare_wiiu_ci.py

      - name: Restore the RedHills toolchain cache
        id: redhills-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/wiiu-redhills.tar.zst
          key: wiiu-redhills-linux-x64-v1-${{ hashFiles('tools/build/Dockerfile') }}

      - name: Load the cached RedHills toolchain
        if: steps.redhills-cache.outputs.cache-hit == 'true'
        run: zstd -dc "$RUNNER_TEMP/wiiu-redhills.tar.zst" | docker image load

      - name: Build the RedHills toolchain
        if: steps.redhills-cache.outputs.cache-hit != 'true'
        run: |
          image=$(python3 -c 'import sys; sys.path.insert(0, "tools"); import build; print(build.image_tag())')
          python3 -c 'import sys; sys.path.insert(0, "tools"); import build; build.ensure_image(0)'
          docker image save "$image" | zstd -T0 -o "$RUNNER_TEMP/wiiu-redhills.tar.zst"

      - name: Save the RedHills toolchain before building the game
        if: steps.redhills-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/wiiu-redhills.tar.zst
          key: ${{ steps.redhills-cache.outputs.cache-primary-key }}

      - name: Build the Wii U RPX
        run: |
          rm -f -- "$RUNNER_TEMP/wiiu-redhills.tar.zst"
          python3 tools/build.py

      - name: Package the Wii U homebrew bundle
        run: |
          python3 tools/package.py --code-only
          cp tools/build/third_party/bearssl-LICENSE.txt build/BearSSL-LICENSE.txt

      - name: Upload the RPX and link map
        uses: actions/upload-artifact@v7
        with:
          name: wiiu-rpx
          if-no-files-found: error
          path: |
            build/Minecraft.Client.rpx
            build/Minecraft.Client.map
            build/BearSSL-LICENSE.txt

      - name: Upload the WUHB
        uses: actions/upload-artifact@v7
        with:
          name: wiiu-wuhb
          if-no-files-found: error
          path: |
            build/LCEReborn.wuhb
            build/BearSSL-LICENSE.txt

  publish:
    if: inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the Wii U build
        uses: actions/download-artifact@v7
        with:
          name: wiiu-rpx
          path: wiiu-rpx

      - name: Download the Wii U homebrew bundle
        uses: actions/download-artifact@v7
        with:
          name: wiiu-wuhb
          path: wiiu-wuhb

      - name: Attach the experimental build to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]; then
            echo '::error::Expected an existing version tag such as v1.2.6.'
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json body > release.json
          asset="LCEReborn-Live-WiiU-Experimental-$RELEASE_TAG.rpx"
          bundle="LCEReborn-Live-WiiU-Experimental-$RELEASE_TAG.wuhb"
          cp wiiu-rpx/Minecraft.Client.rpx "$asset"
          cp wiiu-wuhb/LCEReborn.wuhb "$bundle"
          test -s "$asset"
          test -s "$bundle"
          gh release upload "$RELEASE_TAG" "$asset#Experimental Wii U RPX" \
            "$bundle#Experimental Wii U WUHB" wiiu-wuhb/BearSSL-LICENSE.txt --clobber
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          start = '<!-- wiiu-experimental:start -->'
          end = '<!-- wiiu-experimental:end -->'
          old = json.loads(Path('release.json').read_text(encoding='utf-8'))['body'] or ''
          old = re.sub(re.escape(start) + r'.*?' + re.escape(end), '', old, flags=re.S).rstrip()
          repo = os.environ['GH_REPO']
          revision = os.environ['GITHUB_SHA']
          tag = os.environ['RELEASE_TAG']
          notes = f'''{start}
          ## Experimental Wii U build

          Download `LCEReborn-Live-WiiU-Experimental-{tag}.wuhb` from Assets. Prepare game content from your own decrypted base game and Update 688 dumps.

          1. In a [checkout of this build's source](https://github.com/{repo}/tree/{revision}), run `python tools/prepare.py --base "<base dump>" --update "<Update 688 dump>"`.
          2. Copy the prepared `assets/` contents into `wiiu/LCEReborn/content/` on the Wii U SD card or in the `sdcard/` directory under Cemu's user data.
          3. Run `python tools/launch_cemu.py "<path to Cemu>" --bundle "<downloaded WUHB>"` or put the WUHB in `wiiu/apps/` on the Wii U SD card and launch it with Aroma.
          4. In the game, select **LCE Live**. Enter the code at [lcereborn.xyz/authorize](https://lcereborn.xyz/authorize) on a phone or PC, then confirm the sign-in.

          See the [Wii U setup guide](https://github.com/{repo}/blob/{revision}/docs/building.md) for details.
          {end}'''
          Path('release-notes.md').write_text((old + '\n\n' if old else '') + notes + '\n', encoding='utf-8')
          PY
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
