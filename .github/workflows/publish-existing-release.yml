name: Publish existing release artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build workflow run ID
        required: true
        type: string
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Windows build artifact
        uses: actions/download-artifact@v7
        with:
          name: LCEReborn-Live-Windows
          path: build/release-assets/windows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux build artifact
        uses: actions/download-artifact@v7
        with:
          name: LCEReborn-Live-Linux
          path: build/release-assets/linux
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find build/release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then echo "No release assets were downloaded" >&2; exit 1; fi
          notes="docs/releases/$RELEASE_TAG.md"
          title="LCEReborn Live $RELEASE_TAG"
          if [[ -f "$notes" ]]; then
            heading="$(head -n 1 "$notes")"
            if [[ "$heading" =~ ^#[[:space:]]+(.+)$ ]]; then title="${BASH_REMATCH[1]}"; fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --title "$title" --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --title "$title" --generate-notes
          fi
