name: Windows and Linux build and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish from this workflow
        type: string
      publish_release:
        description: Publish the build artifacts as a GitHub Release
        type: boolean
        default: true
  push:
    branches:
      - main
      - live-integration
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  LCE_RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  windows:
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/build/windows-sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/deps
            build/qt
          key: windows-build-deps-${{ hashFiles('tools/build/deps.json', 'tools/build/qt.json') }}

      - name: Check game data downloader
        run: node --test tools/tests/game_download_test.mjs

      - name: Verify bundled game assets
        run: python tools/bundled_assets.py

      - name: Check bundled asset packaging
        run: python -m unittest discover -s tools/tests -p test_bundled_assets.py

      - name: Check dedicated server packaging
        run: python -m unittest discover -s tools/tests -p test_server_package.py

      - name: Prepare bundled Node.js runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& node --version).Trim()
          python tools/build/node_runtime.py --version $version --platform win-x64 --output build/pc/live-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Restore Windows compiler cache
        uses: actions/cache/restore@v5
        with:
          path: build/windows-sccache
          key: windows-clang-cl-v1-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: windows-clang-cl-v1-${{ runner.arch }}-
      - name: Set up sccache
        id: windows-sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.19.0
        continue-on-error: true
      - name: Check controller cursor timing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/cursor-tests -Force | Out-Null
          cl /nologo /EHsc /std:c++17 /I source tools/tests/pc_cursor_motion_test.cpp /Fo:build/cursor-tests/cursor.obj /Fe:build/cursor-tests/cursor.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/cursor-tests/cursor.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build/deps.py build/deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build/layout.py build/deps build/third_party
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build/qt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cacheArgs = @()
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --start-server
            if ($LASTEXITCODE -eq 0) {
              $cacheArgs = @('-DCMAKE_C_COMPILER_LAUNCHER=sccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=sccache')
            }
          }
          cmake -S . -B build/pc -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release @cacheArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/pc --parallel ([Math]::Min(4, [Environment]::ProcessorCount))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($cacheArgs.Count -ne 0) { sccache --show-stats }
          python tools/package_pc.py --build build/pc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_server.py --build build/pc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Windows compiler cache
        if: github.event_name == 'push' && steps.windows-sccache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: build/windows-sccache
          key: windows-clang-cl-v1-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}

      - name: Name Windows dedicated server package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:LCE_RELEASE_TAG) { $env:LCE_RELEASE_TAG.TrimStart('v') } else { '0.1.0' }
          $server = @(Get-ChildItem build -Filter 'LCEReborn-server-windows-*.zip')
          if ($server.Count -ne 1) { throw 'Expected exactly one Windows dedicated server package' }
          Move-Item -LiteralPath $server[0].FullName -Destination "build/LCEReborn-Live-Server-Windows-$version.zip"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem build -Filter 'LCEReborn-pc-*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'The portable package ZIP was not created' }
          $version = if ($env:LCE_RELEASE_TAG) { $env:LCE_RELEASE_TAG.TrimStart('v') } else { '0.1.0' }
          Move-Item -LiteralPath $archive.FullName -Destination (Join-Path $archive.DirectoryName "LCEReborn-Live-Portable-$version.zip")
          $archive = Get-ChildItem build -Filter 'LCEReborn-Live-Portable-*.zip' | Select-Object -First 1
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/installer-files'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $stage -Force
          if (-not (Test-Path (Join-Path $stage 'LCERebornLauncher.exe'))) { throw 'The portable archive is missing LCERebornLauncher.exe at its root' }
          $compilerPath = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compilerPath) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
            if (Test-Path $candidate) { $compilerPath = $candidate }
          }
          if (-not $compilerPath) { throw 'Inno Setup ISCC.exe is missing from the runner' }
          Push-Location tools
          & $compilerPath "/DAppVersion=$version" installer.iss
          Pop-Location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LCEReborn-Live-Windows
          path: |
            build/LCEReborn-Live-Portable-*.zip
            build/release/LCEReborn-Live-Installer-*.exe
            build/LCEReborn-Live-Server-Windows-*.zip
          if-no-files-found: error


  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Docker
        uses: docker/setup-buildx-action@v3

      - name: Cache Linux build dependencies
        uses: actions/cache@v5
        with:
          path: build/deps
          key: linux-build-deps-${{ hashFiles('tools/build/deps.json') }}

      - name: Restore Linux compiler cache
        uses: actions/cache/restore@v5
        with:
          path: build/linux-ccache
          key: linux-clang-v1-${{ runner.arch }}-${{ hashFiles('tools/build/Dockerfile.linux') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: linux-clang-v1-${{ runner.arch }}-${{ hashFiles('tools/build/Dockerfile.linux') }}-

      - name: Check game data downloader
        run: node --test tools/tests/game_download_test.mjs

      - name: Verify bundled game assets
        run: python tools/bundled_assets.py

      - name: Check bundled asset packaging
        run: python -m unittest discover -s tools/tests -p test_bundled_assets.py

      - name: Check dedicated server packaging
        run: python -m unittest discover -s tools/tests -p test_server_package.py

      - name: Build and package Linux client
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/deps.py build/deps
          python tools/build/layout.py build/deps build/third_party
          python tools/build_linux.py --compiler-cache
          version="${LCE_RELEASE_TAG#v}"
          if [[ -z "$version" ]]; then version="0.1.0"; fi
          mv build/LCEReborn-linux-*.AppImage "build/LCEReborn-Live-Linux-$version.AppImage"
          mv build/LCEReborn-linux-*.tar.gz "build/LCEReborn-Live-Linux-Portable-$version.tar.gz"
          mv build/LCEReborn-server-linux-*.tar.gz "build/LCEReborn-Live-Server-Linux-$version.tar.gz"

      - name: Save Linux compiler cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: build/linux-ccache
          key: linux-clang-v1-${{ runner.arch }}-${{ hashFiles('tools/build/Dockerfile.linux') }}-${{ github.sha }}-${{ github.run_id }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LCEReborn-Live-Linux
          path: |
            build/LCEReborn-Live-Linux-*.AppImage
            build/LCEReborn-Live-Linux-Portable-*.tar.gz
            build/LCEReborn-Live-Server-Linux-*.tar.gz
          if-no-files-found: error

  release:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.publish_release) &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v'))
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: LCEReborn-Live-Windows
          path: build/release-assets/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: LCEReborn-Live-Linux
          path: build/release-assets/linux

      - name: Read console artifact sources
        id: consoles
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          sources="docs/releases/$RELEASE_TAG-artifacts.json"
          if [[ -f "$sources" ]]; then
            wiiu=$(jq -er '.wiiu_run | tostring | select(test("^[0-9]+$"))' "$sources")
            switch=$(jq -er '.switch_run | tostring | select(test("^[0-9]+$"))' "$sources")
            printf 'wiiu=%s\nswitch=%s\n' "$wiiu" "$switch" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the complete Wii U WUHB
        if: steps.consoles.outputs.wiiu != ''
        uses: actions/download-artifact@v7
        with:
          name: wiiu-wuhb-complete
          path: build/console-artifacts/wiiu
          run-id: ${{ steps.consoles.outputs.wiiu }}
          github-token: ${{ github.token }}

      - name: Download the complete Switch NRO
        if: steps.consoles.outputs.switch != ''
        uses: actions/download-artifact@v7
        with:
          name: LCEReborn-Full.nro
          path: build/console-artifacts/switch
          run-id: ${{ steps.consoles.outputs.switch }}
          github-token: ${{ github.token }}

      - name: Stage console release assets
        if: steps.consoles.outputs.switch != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          input="$PWD/build/console-artifacts"
          output="$PWD/build/release-assets/consoles"
          mkdir -p "$output"
          stage() {
            test -s "$input/$1"
            mv "$input/$1" "$output/$2"
          }
          stage 'wiiu/LCEReborn-complete.wuhb' "LCEReborn-WiiU-Full-Beta-$RELEASE_TAG.wuhb"
          stage 'wiiu/BearSSL-LICENSE.txt' 'BearSSL-LICENSE.txt'
          stage 'switch/LCEReborn-Full.nro' 'LCEReborn-Full.nro'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -d '' assets < <(find build/release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then echo "No release assets were downloaded" >&2; exit 1; fi
          notes="docs/releases/$RELEASE_TAG.md"
          title="LCEReborn Live $RELEASE_TAG"
          if [[ -f "$notes" ]]; then
            heading="$(head -n 1 "$notes")"
            if [[ "$heading" =~ ^#[[:space:]]+(.+)$ ]]; then title="${BASH_REMATCH[1]}"; fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --title "$title" --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --verify-tag --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --verify-tag --title "$title" --generate-notes
          fi
