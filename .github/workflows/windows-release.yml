name: Windows and Linux build and release

on:
  push:
    branches:
      - main
      - live-integration
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/deps
            build/qt
          key: windows-build-deps-${{ hashFiles('tools/build/deps.json', 'tools/build/qt.json') }}

      - name: Prepare bundled Node.js runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& node --version).Trim()
          python tools/build/node_runtime.py --version $version --platform win-x64 --output build/pc/live-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Check controller cursor timing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/cursor-tests -Force | Out-Null
          cl /nologo /EHsc /std:c++17 /I source tools/tests/pc_cursor_motion_test.cpp /Fo:build/cursor-tests/cursor.obj /Fe:build/cursor-tests/cursor.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/cursor-tests/cursor.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build/deps.py build/deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build/layout.py build/deps build/third_party
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build/qt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build/pc -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/pc --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_pc.py --build build/pc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem build -Filter 'LCEReborn-pc-*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'The portable package ZIP was not created' }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          Move-Item -LiteralPath $archive.FullName -Destination (Join-Path $archive.DirectoryName "LCEReborn-Live-Portable-$version.zip")
          $archive = Get-ChildItem build -Filter 'LCEReborn-Live-Portable-*.zip' | Select-Object -First 1
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/installer-files'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $stage -Force
          if (-not (Test-Path (Join-Path $stage 'LCERebornLauncher.exe'))) { throw 'The portable archive is missing LCERebornLauncher.exe at its root' }
          $compilerPath = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compilerPath) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
            if (Test-Path $candidate) { $compilerPath = $candidate }
          }
          if (-not $compilerPath) { throw 'Inno Setup ISCC.exe is missing from the runner' }
          Push-Location tools
          & $compilerPath "/DAppVersion=$version" installer.iss
          Pop-Location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LCEReborn-Live-Windows
          path: |
            build/LCEReborn-Live-Portable-*.zip
            build/release/LCEReborn-Live-Installer-*.exe
          if-no-files-found: error


  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and package Linux client
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/deps.py build/deps
          python tools/build/layout.py build/deps build/third_party
          python tools/build_linux.py
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="0.1.0"; fi
          mv build/LCEReborn-linux-*.AppImage "build/LCEReborn-Live-Linux-$version.AppImage"
          mv build/LCEReborn-linux-*.tar.gz "build/LCEReborn-Live-Linux-Portable-$version.tar.gz"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LCEReborn-Live-Linux
          path: |
            build/LCEReborn-Live-Linux-*.AppImage
            build/LCEReborn-Live-Linux-Portable-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: LCEReborn-Live-Windows
          path: build/release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: LCEReborn-Live-Linux
          path: build/release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(build/release-assets/*)
          if (( ${#assets[@]} == 0 )); then echo "No release assets were downloaded" >&2; exit 1; fi
          notes="docs/releases/$RELEASE_TAG.md"
          title="LCEReborn Live $RELEASE_TAG"
          if [[ -f "$notes" ]]; then
            heading="$(head -n 1 "$notes")"
            if [[ "$heading" =~ ^#[[:space:]]+(.+)$ ]]; then title="${BASH_REMATCH[1]}"; fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --title "$title" --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --title "$title" --generate-notes
          fi
