<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>Вход в лаунчер — LCE Live</title>
  <link rel="stylesheet" href="/styles.css?v=4"><script defer src="/authorize.js?v=2"></script>
</head>
<body>
  <header class="topbar wrap"><a class="brand" href="/"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span>LCE<span class="brand-light">LIVE</span></span></a></header>
  <main class="wrap" style="max-width:520px;padding:70px 0">
    <p class="section-kicker">ВХОД В ЛАУНЧЕР</p><h1>Разрешить доступ?</h1>
    <p>Сравни код с кодом в лаунчере. Разрешай вход только если сам его открыл.</p>
    <div class="panel">
      <p>Код подтверждения: <strong id="code">—</strong></p><p id="identity">Проверяем аккаунт…</p>
      <form id="login" hidden>
        <label for="username">Имя пользователя</label><input id="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username">
        <label for="password" style="margin-top:15px">Пароль</label><input id="password" type="password" required minlength="10" autocomplete="current-password">
        <button id="login-submit" class="button button-primary" style="margin-top:16px" type="submit">Войти</button>
        <p><button id="auth-switch" class="button button-outline" type="button">Нет аккаунта? Создайте!</button></p>
      </form>
      <div id="actions" hidden><button id="allow" class="button button-primary" type="button">Разрешить</button> <button id="deny" class="button button-outline" type="button">Отказать</button></div>
      <p id="message" class="form-message" role="status"></p>
    </div>
  </main>
</body>
</html>
